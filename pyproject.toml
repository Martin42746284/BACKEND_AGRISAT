[project]
name = "agrisat-backend"
version = "1.0.0"
description = "AGRISAT backend API — détection et analyse de parcelles agricoles par imagerie satellite"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2",
    "httpx>=0.27,<0.29",  # 0.28 requis par ultralytics-platform (modèle de segmentation embarqué)
    "google-auth>=2.35,<3",
    "requests>=2.32,<3",  # transport requis par google.auth.transport.requests.Request (credentials.refresh)
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",  # morphologie et composantes connexes des lignes rouges (app/services/gemini_parcels_image.py)
    "shapely>=2.0,<3",
    "pyarrow>=15",  # lecture par blocs du GeoParquet Fields of The World (app/services/zone_parcels.py)
    "pandas>=2.2,<3",  # construction des features du classifieur RF orge (app/services/barley_rf_classifier.py)
    "scikit-learn>=1.5,<1.10",  # pipeline du modèle RF orge (joblib) — même version que l'entraînement (1.9.x)
    "joblib>=1.3,<2",  # chargement de app/data/models/orge_rf/orge_rf.joblib
    "pillow>=10,<14",  # décodage des images de /api/field-segmentation (Pillow 13 requis par opencv 5 / ultralytics 8.4)
    "torch>=2.0,<3",  # inférence locale du modèle YOLO de segmentation (CPU ou GPU)
    "ultralytics>=8.3,<9",  # chargement et exécution de parcel_segmentation_yolo.pt
    "geopandas>=1.0,<2",  # service de traçage VHR (lecture/écriture GeoJSON)
    "affine>=3,<4",  # géoréférencement des tuiles Esri
    "rasterio>=1.4,<2",  # rasterisation des contours dans filtre_non_agricole
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
